<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="vibes">
<meta name="theme-color" content="#04050c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>vibes</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/michroma@5.3.0/latin-400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/share-tech-mono@5.3.0/latin-400.css">
<style>
  * { box-sizing: border-box; }
  * { margin: 0; padding: 0; }

  /* Hall of Space, circa 1984: black gallery, backlit panels, sunset
     stripes, wide techno headlines, Helvetica captions, a VFD clock. */
  :root {
    --void:    #04050c;
    --panel:   #0b0e1c;
    --panel-2: #10152a;
    --edge:    #232a48;
    --white:   #f1f3ff;
    --text:    #c9cfe8;
    --muted:   #8890b3;
    --dim:     #565e85;
    --vfd:     #5ef2d6;

    --s1: #ffd23a;
    --s2: #ff9f1c;
    --s3: #ff5a36;
    --s4: #e8306f;
    --s5: #9b3fd1;
    --stripes: linear-gradient(180deg,
      var(--s1) 0 20%, var(--s2) 20% 40%, var(--s3) 40% 60%, var(--s4) 60% 80%, var(--s5) 80% 100%);
    --stripes-h: linear-gradient(90deg,
      var(--s1) 0 20%, var(--s2) 20% 40%, var(--s3) 40% 60%, var(--s4) 60% 80%, var(--s5) 80% 100%);

    --display: 'Michroma', 'Eurostile', 'Microgramma', 'Arial Black', sans-serif;
    --body:    'Helvetica Neue', Helvetica, Arial, sans-serif;
    --mono:    'Share Tech Mono', ui-monospace, 'SF Mono', Menlo, monospace;

    --grease-body:    #ff5a4e;
    --grease-home:    #ffc23a;
    --grease-science: #35c8ff;
    --grease-music:   #b77bff;
    --grease-games:   #74e06a;
    --grease-tv:      #ff8f2e;
    --grease-art:     #ff5fb0;
    --grease-work:    #7fe0cc;
    --grease-education: #d4e04a;
  }

  html { background-color: var(--void); }

  body {
    position: relative;
    font-family: var(--body);
    background-color: var(--void);
    background-image:
      radial-gradient(90% 50% at 50% 115%, rgba(155,63,209,0.28) 0%, rgba(232,48,111,0.08) 45%, transparent 70%),
      radial-gradient(60% 40% at 85% 5%, rgba(53,200,255,0.08) 0%, transparent 70%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* two layers of stars, the near one twinkles */
  .stars, .stars::after {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .stars {
    background-image:
      radial-gradient(1px 1px at 20px 30px, #fff, transparent),
      radial-gradient(1px 1px at 120px 80px, #cfd6ff, transparent),
      radial-gradient(1px 1px at 200px 160px, #fff, transparent),
      radial-gradient(1px 1px at 60px 210px, #ffe7c4, transparent),
      radial-gradient(1px 1px at 250px 260px, #fff, transparent),
      radial-gradient(1px 1px at 170px 20px, #cfd6ff, transparent);
    background-size: 280px 280px;
    opacity: 0.55;
  }
  .stars::after {
    content: "";
    background-image:
      radial-gradient(1.5px 1.5px at 70px 120px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 330px 40px, #bfeaff, transparent),
      radial-gradient(2px 2px at 260px 330px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 400px 220px, #ffd9a8, transparent);
    background-size: 460px 460px;
    animation: twinkle 5s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: 0.35; } to { opacity: 0.95; } }

  /* receding horizon grid at the bottom of the hall */
  .horizon {
    position: fixed; left: -50%; right: -50%; bottom: 0;
    height: 34vh;
    pointer-events: none;
    z-index: 0;
    background-image:
      linear-gradient(rgba(232,48,111,0.35) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,48,111,0.35) 1px, transparent 1px);
    background-size: 60px 30px;
    transform: perspective(300px) rotateX(62deg);
    transform-origin: bottom;
    -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 85%);
            mask-image: linear-gradient(to top, #000 0%, transparent 85%);
    opacity: 0.5;
  }
  @media (prefers-reduced-motion: reduce) {
    .stars::after { animation: none; opacity: 0.7; }
  }

  /* ── Clock: top-left VFD readout, Chicago time ── */
  .clock {
    position: absolute;
    top: 12px; left: 16px;
    z-index: 2;
    display: flex; align-items: baseline; gap: 6px;
    padding: 4px 8px 3px;
    border: 1px solid var(--edge);
    border-radius: 3px;
    background: rgba(4,5,12,0.75);
    font-family: var(--mono);
    font-size: 14px;
    color: var(--vfd);
    text-shadow: 0 0 6px rgba(94,242,214,0.7);
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
  }
  .clock .ap, .clock .tz { font-size: 11px; opacity: 0.75; }
  .clock .tz { color: var(--s2); text-shadow: 0 0 6px rgba(255,159,28,0.6); }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 720px; margin: 0 auto; padding: 60px 20px 120px;
  }

  /* ── Title panel: the big backlit sign at the gallery entrance ── */
  header {
    position: relative;
    margin-bottom: 22px;
    padding: 26px 26px 24px 46px;
    border: 1px solid var(--edge);
    border-radius: 14px;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    box-shadow: 0 0 0 4px rgba(4,5,12,0.9), 0 20px 60px rgba(0,0,0,0.6);
    overflow: hidden;
  }
  header::before {
    content: "";
    position: absolute; left: 18px; top: 0; bottom: 0;
    width: 14px;
    background: var(--stripes-h);
  }
  .kicker {
    font-family: var(--mono);
    font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(38px, 12vw, 84px);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--white);
    margin: 8px 0 6px;
    line-height: 1;
    text-shadow: 0 0 24px rgba(53,200,255,0.25);
  }
  .tagline {
    font-family: var(--display);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--s2);
  }

  /* ── Control rail ── */
  .rail {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    margin: 0 0 6px;
  }
  .chip {
    font-family: var(--display);
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 4px;
    padding: 8px 11px;
    min-height: 34px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .chip:hover { border-color: var(--muted); color: var(--white); }
  .chip.on { color: var(--void); }
  .chip.on { background: var(--cat, var(--white)); border-color: var(--cat, var(--white)); }
  .chip .n { margin-left: 6px; opacity: 0.55; font-family: var(--mono); font-size: 11px; }

  .find {
    flex: 1 1 100%;
    margin-top: 6px;
    font-size: 16px;
    font-family: var(--mono);
    letter-spacing: 0.5px;
    color: var(--vfd);
    background: rgba(4,5,12,0.8);
    border: 1px solid var(--edge);
    border-radius: 4px;
    padding: 11px 12px;
    width: 100%;
    outline: none;
    caret-color: var(--vfd);
  }
  .find::placeholder { color: var(--dim); }
  .find:focus { border-color: var(--vfd); box-shadow: 0 0 0 1px rgba(94,242,214,0.25); }

  /* command hint under the rail */
  .cmdbar {
    min-height: 20px;
    margin: 6px 0 14px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--dim);
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 6px;
  }
  .cmdbar .key {
    color: var(--void); background: var(--vfd);
    padding: 0 6px; border-radius: 2px;
  }
  .cmdbar b { color: var(--white); font-weight: 400; }

  /* ── List: one display case per tool ── */
  .sheet {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .frame {
    position: relative;
    text-decoration: none;
    color: inherit;
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding: 16px 16px 16px 22px;
    border: 1px solid var(--edge);
    border-radius: 10px;
    background: linear-gradient(180deg, rgba(16,21,42,0.92), rgba(11,14,28,0.92));
    overflow: hidden;
    transition: border-color 0.15s, transform 0.15s;
  }
  /* category color bar down the left edge */
  .frame::before {
    content: "";
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 6px;
    background: var(--cat);
  }
  .frame:hover { border-color: var(--cat); transform: translateX(2px); }
  .frame.lead { border-color: var(--vfd); box-shadow: 0 0 0 1px rgba(94,242,214,0.3); }

  /* backlit pictogram tile */
  .icon-box {
    flex-shrink: 0;
    width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--edge);
    border-radius: 8px;
    background: radial-gradient(circle at 50% 40%, #182040 0%, #070915 80%);
  }
  .icon-box svg {
    width: 60%; height: 60%;
    filter: drop-shadow(0 0 4px currentColor);
  }

  .body { min-width: 0; flex: 1; }
  .exhibit {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 4px;
  }
  .exhibit .cat { color: var(--cat); }
  .title {
    font-family: var(--display);
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--white);
    line-height: 1.3;
  }
  .desc {
    font-size: 15px; line-height: 1.5; color: var(--text);
    margin-top: 6px;
  }
  .chev {
    flex-shrink: 0; align-self: center;
    font-family: var(--mono); font-size: 18px;
    color: var(--dim);
  }
  .frame:hover .chev { color: var(--cat); }

  .none {
    padding: 40px 0; text-align: center;
    font-family: var(--mono); color: var(--muted);
  }

  .colophon {
    margin-top: 36px;
    height: 10px;
    border-radius: 2px;
    background: linear-gradient(180deg,
      var(--s1) 0 20%, var(--s2) 20% 40%, var(--s3) 40% 60%, var(--s4) 60% 80%, var(--s5) 80% 100%);
    opacity: 0.85;
  }

  @media (max-width: 480px) {
    header { padding: 22px 18px 20px 40px; }
    header::before { left: 14px; width: 12px; }
    .frame { gap: 12px; padding: 14px 12px 14px 18px; }
    .icon-box { width: 46px; height: 46px; }
    .chev { display: none; }
  }
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<div class="horizon" aria-hidden="true"></div>
<div class="clock" id="clock" role="timer" aria-label="Central time"></div>
<div class="wrap">

  <header>
    <div class="kicker">junk.timbornholdt.com</div>
    <h1>vibes</h1>
    <div class="tagline">Hall of small tools &middot; Gallery 3</div>
  </header>

  <div class="rail" id="rail">
    <input class="find" id="find" type="text" placeholder="search, or type a name + ↵ — try “random”" autocomplete="off" autocapitalize="off" spellcheck="false">
  </div>
  <div class="cmdbar" id="cmdbar"></div>

  <div class="sheet" id="sheet"></div>

  <div class="colophon" aria-hidden="true"></div>

</div>

<script>
  const tools = [
    { file: "comics.html", title: "Comics", tags: ["art"], desc: "Flip through the latest strips from 400+ smallweb webcomics, courtesy of Kagi's smallcomic list. Each comic links to its site and RSS feed; remove the ones that aren't for you." },
    { file: "crazy-rummy.html", title: "Crazy Rummy Scoresheet", tags: ["games"], desc: "Score sheet for crazy rummy nights: enter each round's score and the running total does the math for you. Tracks whose deal it is from 3s through Ks, crowns the leader, and remembers the game if you close the tab." },
    { file: "cf-machine-spec-survey.html", title: "Machine Spec Survey", tags: ["work"], desc: "Nine questions about how you actually work — displays, peripherals, what's open on a Tuesday afternoon — then it recommends a machine and lets you pick a color. Copy the summary into Slack when you're done." },
    { file: "sketchpad.html", title: "Sketchpad", tags: ["art"], desc: "A full-screen drawing canvas for your finger: three brush widths, any color, nothing else in the way. Screenshot it when you're done." },
    { file: "aqi-radar.html", title: "Twin Cities AQI Radar", tags: ["science"], desc: "A weather-radar-style map of metro air quality you can play back over the last 48 hours. Real station readings via a free WAQI token; every frame is labeled observed vs. model estimate." },
    { file: "album-publisher.html", title: "Album Publisher", tags: ["music", "work"], desc: "Search your Plex library, pull an album's art, release date, and genres straight onto timbornholdt.com, then write the review from anywhere. Also edits reviews for albums already on the site." },
    { file: "snes-world.html", title: "SNES World", tags: ["games", "music"], desc: "A website you walk through: side-scroll down a dusk street, jump, crouch, and swing at the shrubbery, then step into a midcentury den and drop the needle on the record player. Future home of the music library." },
    { file: "timamp.html", title: "Timamp", tags: ["music"], desc: "A Winamp for your wall: streams a Plex playlist, album, or collection — or a live internet-radio station — through the classic skinned player, with a real Milkdrop visualizer, shuffle-able skins, and last.fm scrobbling. Paste your server URL and token, pick a source, mount the tablet." },
    { file: "90s-lunch-wheel.html", title: "Wheel of Lunch", tags: ["body", "games"], desc: "Spin a cheesy 90s game-show wheel rendered on a low-res tube TV to pick a balanced, high-protein lunch. Synth ticking and a win fanfare included." },
    { file: "simpsons-episode-rater.html", title: "The Simpsons Episode Rater", tags: ["tv"], desc: "Rate every episode from the golden-age seasons 1-8, with synopses. Export your scores and pool them with friends." },
    { file: "back-routine.html",   title: "Nightly Back Routine",     tags: ["body"],    desc: "Guided back mobility with hold timers and a daily streak." },
    { file: "tattoo-care.html",    title: "Skull / Marshmallow Care", tags: ["body"],    desc: "Tattoo aftercare timeline that auto-hides past phases." },
    { file: "house-gripes.html",   title: "Stuff That Sucks",         tags: ["home"],    desc: "Household annoyances that climb the list each time they bug you." },
    { file: "anatomy-lab.html",    title: "Anatomy Lab",              tags: ["education", "science", "body"], desc: "Tap any bone, muscle, or organ to learn what it does." },
    { file: "lofi-guide.html",     title: "A Field Guide to Lo-Fi",   tags: ["education", "music"],   desc: "A checkable listening path through the genre's foundations." },
    { file: "music-syllabus.html", title: "The Syllabus",             tags: ["education", "music"],   desc: "A 14-album guided listen across punk, emo, folk and more." },
    { file: "ps2-curriculum.html", title: "PS2 Gaming Curriculum",    tags: ["education", "games"],   desc: "12 all-timers sequenced by genre. A syllabus for games." },
  ];
  const greaseColor = {
    body: "var(--grease-body)", home: "var(--grease-home)", science: "var(--grease-science)",
    music: "var(--grease-music)", games: "var(--grease-games)", tv: "var(--grease-tv)",
    art: "var(--grease-art)", work: "var(--grease-work)", education: "var(--grease-education)",
  };
  // Filter chips, in rail order. A tool can carry several tags; its first tag sets its color.
  const tagOrder = ["education", "music", "games", "body", "science", "art", "tv", "home", "work"];

  // Hand-drawn line-art icon per page. viewBox 0 0 96 96, stroke=currentColor
  // so each card tints it with its category color. New tools need one of these.
  const svg = (inner) =>
    `<svg viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
  const icons = {
    // comic panel with a speech bubble
    "comics.html": svg(`
      <rect x="18" y="20" width="60" height="56" rx="4"/>
      <path d="M48 20v56M18 48h30"/>
      <path d="M54 34c0-4 4-6 9-6s9 2 9 6-4 6-9 6l-6 4 2-5c-3-1-5-2-5-5z" fill="currentColor" stroke="none"/>
      <circle cx="30" cy="36" r="3" fill="currentColor" stroke="none"/>
      <path d="M26 58c1-3 7-3 8 0"/>`),
    // fanned pair of playing cards, heart pip on the front one
    "crazy-rummy.html": svg(`
      <rect x="38" y="26" width="34" height="48" rx="5" transform="rotate(10 55 50)"/>
      <rect x="22" y="22" width="34" height="48" rx="5"/>
      <path d="M39 40c-3-5-10-3-10 3 0 5 7 8 10 12 3-4 10-7 10-12 0-6-7-8-10-3z" fill="currentColor" stroke="none"/>`),
    // laptop with a checked-off list on the screen
    "cf-machine-spec-survey.html": svg(`
      <path d="M26 22h44v36H26z"/>
      <path d="M12 70h72l-8-12H20z"/>
      <path d="M36 34l4 4 8-8"/>
      <path d="M36 48h22"/>`),
    // pencil drawing a squiggle
    "sketchpad.html": svg(`
      <path d="M64 18l14 14-38 38-18 4 4-18 38-38z"/>
      <path d="M58 24l14 14"/>
      <path d="M16 82c8-8 14 4 22-4" stroke-width="4"/>`),
    // radar dish: concentric rings, sweep arm, one hot blip
    "aqi-radar.html": svg(`
      <circle cx="48" cy="50" r="30"/>
      <circle cx="48" cy="50" r="18" opacity="0.6"/>
      <circle cx="48" cy="50" r="7" opacity="0.4"/>
      <path d="M48 50 L72 30"/>
      <circle cx="48" cy="50" r="2.6" fill="currentColor" stroke="none"/>
      <circle cx="36" cy="62" r="4" fill="currentColor" stroke="none"/>`),
    // record sliding out of its sleeve, pencil underneath for the review
    "album-publisher.html": svg(`
      <rect x="14" y="18" width="42" height="42" rx="4"/>
      <circle cx="60" cy="39" r="16"/>
      <circle cx="60" cy="39" r="2.6" fill="currentColor" stroke="none"/>
      <path d="M24 78l32-32"/>
      <path d="M24 78l3-9 6 6-9 3z" fill="currentColor" stroke="none"/>`),
    // little hero jumping toward a flat-roof house, side-scroller style
    "snes-world.html": svg(`
      <path d="M8 76h80"/>
      <path d="M42 32h40"/>
      <rect x="47" y="32" width="30" height="44"/>
      <rect x="56" y="54" width="11" height="22"/>
      <rect x="16" y="38" width="13" height="13" rx="3"/>
      <path d="M18 55h9M22 55v9M22 58l-7 7M22 58l7 7" stroke-width="4"/>
      <path d="M30 30c4-6 10-6 13 0" stroke-width="4" stroke-dasharray="1 7"/>`),
    // player window with an equalizer/visualizer readout
    "timamp.html": svg(`
      <rect x="16" y="28" width="64" height="40" rx="5"/>
      <path d="M16 39h64"/>
      <circle cx="23" cy="33.5" r="1.8" fill="currentColor" stroke="none"/>
      <circle cx="29" cy="33.5" r="1.8" fill="currentColor" stroke="none"/>
      <path d="M27 60V49M35 60V44M43 60V52M51 60V46M59 60V50M67 60V43" stroke-width="4"/>`),
    // game-show wheel with a fork pointer
    "90s-lunch-wheel.html": svg(`
      <circle cx="48" cy="50" r="24"/>
      <path d="M48 26v48M24 50h48M31 33l34 34M65 33 31 67"/>
      <path d="M48 14v9" stroke-width="6"/>
      <circle cx="48" cy="50" r="4" fill="currentColor" stroke="none"/>`),
    // retro television set
    "simpsons-episode-rater.html": svg(`
      <rect x="20" y="38" width="56" height="40" rx="5"/>
      <path d="M41 38 33 22M55 38 63 22"/>
      <rect x="28" y="46" width="30" height="24" rx="2"/>
      <circle cx="68" cy="52" r="2.6" fill="currentColor" stroke="none"/>
      <circle cx="68" cy="62" r="2.6" fill="currentColor" stroke="none"/>`),
    // spine + crescent moon
    "back-routine.html": svg(`
      <path d="M68 14a16 16 0 1 0 13 25 13 13 0 0 1-13-25z" fill="currentColor" stroke="none"/>
      <path d="M40 24c-7 16-7 36 0 52"/>
      <path d="M33 32h15M32 44h15M33 56h15M35 68h14"/>`),
    // skull
    "tattoo-care.html": svg(`
      <path d="M26 46a22 22 0 0 1 44 0c0 9-4 13-4 19 0 4-3 6-7 6H37c-4 0-7-2-7-6 0-6-4-10-4-19z"/>
      <circle cx="39" cy="46" r="5.5" fill="currentColor" stroke="none"/>
      <circle cx="57" cy="46" r="5.5" fill="currentColor" stroke="none"/>
      <path d="M48 56l-3 6h6z" fill="currentColor" stroke="none"/>
      <path d="M42 72v5M48 72v5M54 72v5"/>`),
    // house with an exclamation
    "house-gripes.html": svg(`
      <path d="M22 46 48 24l26 22"/>
      <path d="M29 42v30h38V42"/>
      <path d="M48 50v13"/>
      <circle cx="48" cy="69" r="2.6" fill="currentColor" stroke="none"/>`),
    // anatomical heart
    "anatomy-lab.html": svg(`
      <path d="M48 44c-5-9-22-8-22 7 0 13 17 20 22 26 5-6 22-13 22-26 0-15-17-16-22-7z" fill="currentColor" stroke="none"/>
      <path d="M40 30v8M52 26c0 7-5 9-5 15"/>`),
    // cassette tape
    "lofi-guide.html": svg(`
      <rect x="18" y="28" width="60" height="40" rx="6"/>
      <circle cx="38" cy="45" r="6"/>
      <circle cx="58" cy="45" r="6"/>
      <path d="M30 60h36"/>`),
    // vinyl record
    "music-syllabus.html": svg(`
      <circle cx="48" cy="48" r="26"/>
      <circle cx="48" cy="48" r="9"/>
      <circle cx="48" cy="48" r="2.4" fill="currentColor" stroke="none"/>`),
    // game controller
    "ps2-curriculum.html": svg(`
      <path d="M34 38h28c9 0 16 7 16 16 0 7-9 9-13 3l-3-5H36l-3 5c-4 6-13 4-13-3 0-9 7-16 14-16z"/>
      <path d="M28 50h10M33 45v10"/>
      <circle cx="60" cy="48" r="2.4" fill="currentColor" stroke="none"/>
      <circle cx="67" cy="54" r="2.4" fill="currentColor" stroke="none"/>`),
  };

  const sheet = document.getElementById("sheet");
  const find = document.getElementById("find");
  const cmdbar = document.getElementById("cmdbar");
  // #education etc. in the URL picks the starting filter, so a shelf can be bookmarked
  const fromHash = decodeURIComponent(location.hash.slice(1)).toLowerCase();
  let activeCat = tagOrder.includes(fromHash) ? fromHash : "all";
  let term = "";
  let visible = [];

  const isRandom = (t) => t === "random" || t === "rand" || t === "r";

  function compute() {
    return tools.filter(t => {
      const catOk = activeCat === "all" || t.tags.includes(activeCat);
      // a bare "random" command shouldn't empty the grid
      const textOk = !term || isRandom(term)
        || (t.title + " " + t.desc + " " + t.tags.join(" ")).toLowerCase().includes(term);
      return catOk && textOk;
    });
  }

  function render() {
    visible = compute();
    if (!visible.length) {
      sheet.innerHTML = `<div class="none">NO EXHIBITS MATCH THIS SEARCH</div>`;
    } else {
      sheet.innerHTML = visible.map((t, i) => `
        <a class="frame${term && !isRandom(term) && i === 0 ? " lead" : ""}" href="${t.file}" style="--cat:${greaseColor[t.tags[0]]}">
          <div class="icon-box" style="color:${greaseColor[t.tags[0]]}">${icons[t.file] || ""}</div>
          <div class="body">
            <div class="exhibit">Exhibit ${String(tools.length - tools.indexOf(t)).padStart(2, "0")} &middot; ${t.tags.map(g => `<span class="cat" style="color:${greaseColor[g]}">${g}</span>`).join(" / ")}</div>
            <div class="title">${t.title}</div>
            <div class="desc">${t.desc}</div>
          </div>
          <span class="chev">&rsaquo;</span>
        </a>`).join("");
    }
    renderHint();
  }

  function renderHint() {
    if (isRandom(term)) {
      cmdbar.innerHTML = `<span class="key">↵</span><span>opens a <b>random</b> tool</span>`;
    } else if (term && visible.length) {
      cmdbar.innerHTML = `<span class="key">↵</span><span>opens <b>${visible[0].title}</b></span>`;
    } else {
      cmdbar.innerHTML = "";
    }
  }

  const rail = document.getElementById("rail");
  const chipFor = (tag, label, n) =>
    `<button class="chip${tag === activeCat ? " on" : ""}" data-cat="${tag}"${greaseColor[tag] ? ` style="--cat:${greaseColor[tag]}"` : ""}>${label}<span class="n">${n}</span></button>`;
  rail.insertAdjacentHTML("afterbegin",
    chipFor("all", "All", tools.length) +
    tagOrder.map(g => chipFor(g, g, tools.filter(t => t.tags.includes(g)).length)).join(""));

  rail.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    activeCat = chip.dataset.cat;
    document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === chip));
    history.replaceState(null, "", activeCat === "all" ? location.pathname : `#${activeCat}`);
    render();
  });

  find.addEventListener("input", (e) => {
    term = e.target.value.trim().toLowerCase();
    render();
  });

  find.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    if (isRandom(term)) {
      const pool = visible.length ? visible : tools;
      window.location.href = pool[Math.floor(Math.random() * pool.length)].file;
    } else if (visible.length) {
      window.location.href = visible[0].file;
    }
  });

  render();

  // Small Chicago-time clock in the corner, ticking on the second boundary.
  const clock = document.getElementById("clock");
  const clockFmt = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/Chicago",
    hour: "numeric", minute: "2-digit", second: "2-digit", hour12: true,
  });
  const tzFmt = new Intl.DateTimeFormat("en-US", { timeZone: "America/Chicago", timeZoneName: "short" });

  clock.innerHTML = `<span class="t"></span><span class="ap"></span><span class="tz"></span>`;
  const [clockT, clockAp, clockTz] = ["t", "ap", "tz"].map(c => clock.querySelector("." + c));

  function tick() {
    const now = new Date();
    const parts = Object.fromEntries(clockFmt.formatToParts(now).map(p => [p.type, p.value]));
    clockT.textContent = `${parts.hour}:${parts.minute}:${parts.second}`;
    clockAp.textContent = (parts.dayPeriod || "").toLowerCase();
    // CDT or CST depending on daylight saving
    clockTz.textContent = tzFmt.formatToParts(now).find(p => p.type === "timeZoneName")?.value || "CT";
    setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
  }
  tick();

  if ('serviceWorker' in navigator) {
    const hadController = !!navigator.serviceWorker.controller;
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || refreshing) return;
      refreshing = true;
      location.reload();
    });
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
