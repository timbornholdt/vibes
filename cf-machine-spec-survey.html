<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Machine setup — Creatively Focused</title>
<style>
/* PALETTE — derived from the Creatively Focused logo.
   Brand blue  rgb(41,73,156)   #29499C  — structure and action
   Brand mint  rgb(171,216,178) #ABD8B2  — the result moment
   Everything else is a tint or shade of those two. */
:root{
  --brand-blue:#29499C;
  --brand-mint:#ABD8B2;
  --ink:#1A2333;
  --ink-soft:#5B6478;
  --line:#D9E0EC;
  --canvas:#F5F7FB;
  --surface:#FFFFFF;
  --accent:var(--brand-blue);
  --accent-ink:#FFFFFF;
  --accent-dark:#1F3A7E;
  --accent-tint:#EDF1F9;
  --heading:'Brandon Grotesque','Brandon Text',system-ui,-apple-system,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:32px 20px 80px}
.eyebrow{font-family:var(--heading);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-soft);margin:0 0 6px}
h1{font-family:var(--heading);font-size:26px;line-height:1.2;margin:0 0 10px;font-weight:600}
h2{font-family:var(--heading);font-size:20px;line-height:1.3;margin:0 0 8px;font-weight:600}
p{margin:0 0 14px}
.lede{color:var(--ink-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;margin-bottom:16px}
.hint{font-size:14px;color:var(--ink-soft);margin:-2px 0 16px}
.prog{display:flex;gap:4px;margin-bottom:24px}
.prog i{flex:1;height:3px;background:var(--line);border-radius:2px}
.prog i.on{background:var(--accent)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1px solid var(--line);
  border-radius:8px;background:var(--surface);cursor:pointer;font-size:15px;text-align:left;
  width:100%;font-family:var(--body);color:var(--ink);line-height:1.4}
.opt:hover{border-color:var(--accent)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-tint)}
.opt .box{flex:0 0 auto;width:18px;height:18px;border:1.5px solid var(--line);border-radius:4px;
  margin-top:2px;position:relative}
.opt[aria-pressed="true"] .box{border-color:var(--accent);background:var(--accent)}
.opt[aria-pressed="true"] .box::after{content:"";position:absolute;left:5px;top:2px;width:5px;height:9px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.opt.radio .box{border-radius:50%}
.opt.radio[aria-pressed="true"] .box::after{left:4px;top:4px;width:6px;height:6px;background:#fff;
  border:0;border-radius:50%;transform:none}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;
  font-family:var(--body);font-size:15px;color:var(--ink);background:var(--surface)}
input[type=text]:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.nav{display:flex;gap:10px;align-items:center;margin-top:20px}
button.primary{font-family:var(--heading);font-size:15px;font-weight:600;background:var(--accent);
  color:var(--accent-ink);border:0;border-radius:8px;padding:12px 22px;cursor:pointer}
button.primary:hover:not(:disabled){background:var(--accent-dark)}
button.primary:disabled{opacity:.4;cursor:not-allowed}
button.ghost{font-family:var(--body);font-size:14px;background:none;border:0;color:var(--ink-soft);
  cursor:pointer;padding:12px 4px;text-decoration:underline}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.result{background:var(--brand-mint);border-color:var(--brand-mint)}
.result .machine{color:var(--brand-blue)}
.result .spec{color:#33475F}
.machine{font-family:var(--heading);font-size:25px;font-weight:600;margin:0 0 4px}
.spec{font-size:15px;color:var(--ink-soft);margin:0}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{display:flex;align-items:center;gap:9px;padding:10px 15px;border:1px solid var(--line);
  border-radius:8px;background:var(--surface);cursor:pointer;font-size:15px;font-family:var(--body)}
.sw:hover{border-color:var(--accent)}
.sw[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-tint)}
.sw .chip{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.18)}
textarea#out{width:100%;min-height:170px;padding:14px;border:1px solid var(--line);border-radius:8px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.6;
  white-space:pre;background:var(--surface);color:var(--ink);resize:vertical}
.copied{font-size:14px;color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Creatively Focused</p>
  <h1 id="title">New machine setup</h1>
  <p class="lede" id="sub">A few questions about how you work, then pick a color.</p>
  <div class="prog" id="prog"></div>
  <div id="app"></div>
</div>

<script>
/* CONFIG — edit model names and colors here. */
const MACHINES = {
  neo:{ name:'MacBook Neo 13-inch', chip:'A18 Pro', ram:'8GB', storage:'512GB',
        extras:'512GB SKU, includes Touch ID',
        colors:[['Silver','#d8d9d6'],['Blush','#e9c9c4'],['Citrus','#e6d27a'],['Indigo','#4a5578']] },
  air13:{ name:'MacBook Air 13-inch', chip:'M5',
        colors:[['Sky Blue','#b6c6d6'],['Midnight','#2c3138'],['Starlight','#e7ded1'],['Silver','#dcdedd']] },
  air15:{ name:'MacBook Air 15-inch', chip:'M5',
        colors:[['Sky Blue','#b6c6d6'],['Midnight','#2c3138'],['Starlight','#e7ded1'],['Silver','#dcdedd']] }
};

const Q = [
  { key:'name', type:'text', title:'What is your name?' },
  { key:'displays', type:'radio',
    title:'How many external displays are plugged into your desk right now?',
    hint:'Count what is physically connected today.',
    opts:[['0','None — laptop screen only'],['1','One'],['2','Two or more']] },
  { key:'ports', type:'multi',
    title:'In a normal week, which of these do you plug into your machine?',
    opts:[['usb','USB drive or external SSD'],['sd','SD or memory card'],
          ['hdmi','HDMI cable to a TV or conference room display'],['eth','Wired ethernet'],
          ['audio','Audio interface, USB mic, or capture device'],['none','None of these']] },
  { key:'visual', type:'multi',
    title:'Do you do any of this work?',
    opts:[['video','Edit or export video'],['record','Produce screen recordings or webinars'],
          ['color','Create or approve brand assets where color accuracy matters'],['none','None of these']] },
  { key:'concurrent', type:'multi',
    title:'On a normal Tuesday afternoon, which of these are open at the same time?',
    hint:'Open, not in use. If it is running in the background, count it.',
    opts:[['tabs','Browser with 15+ tabs'],['slack','Slack'],['calls','Zoom or Google Meet'],
          ['canva','Canva'],['hubspot','HubSpot'],['drive','Google Drive, Docs, or Sheets'],
          ['fathom','Fathom'],['sheets','Spreadsheets with heavy formulas or pivot tables'],
          ['asana','Asana'],['mail','A desktop mail app']] },
  { key:'calls', type:'radio',
    title:'How many customer- or district-facing video calls do you run in a typical week?',
    hint:'Internal calls do not count.',
    opts:[['low','Two or fewer'],['mid','Three to five'],['high','Six or more']] },
  { key:'disk', type:'radio',
    title:'Is your current machine more than 60% full with files that are NOT synced to Drive?',
    hint:'Check under \uF8FF menu \u2192 System Settings \u2192 General \u2192 Storage.',
    opts:[['yes','Yes'],['no','No'],['unsure','Not sure']] },
  { key:'restart', type:'radio',
    title:'How often do you restart your machine?',
    opts:[['weekly','About weekly, and I quit apps when done'],['rarely','Rarely — I leave everything running']] },
  { key:'place', type:'radio',
    title:'Where do you work from?',
    opts:[['desk','The same desk almost every day'],['two','Two setups — office and home'],
          ['travel','Travelling or on-site twice a month or more']] }
];

/* GATES — any one firing rules out the Neo. Invisible to the user. */
const GATES = [
  a => a.displays === '2',
  a => { const p=a.ports||[], heavy=['sd','hdmi','eth','audio'];
         return p.some(x=>heavy.includes(x)) || p.filter(x=>x!=='none').length >= 2; },
  a => (a.visual||[]).some(x=>x!=='none'),
  a => (a.concurrent||[]).length >= 4,
  a => a.calls === 'mid' || a.calls === 'high',
  a => a.disk === 'yes' || a.disk === 'unsure'
];

function decide(a){
  const fired = GATES.filter(g => g(a)).length;
  if(!fired) return { m:MACHINES.neo, ram:MACHINES.neo.ram, storage:MACHINES.neo.storage };
  const m = (a.place === 'travel' || a.displays !== '0') ? MACHINES.air13 : MACHINES.air15;
  const heavy = (a.concurrent||[]).length >= 4 || (a.visual||[]).some(x=>x!=='none') || a.restart === 'rarely';
  return { m, ram: heavy ? '24GB' : '16GB', storage: (a.disk === 'yes' || a.disk === 'unsure') ? '1TB' : '512GB' };
}

const A = {};
let step = 0, result = null, color = null;
const app = document.getElementById('app'), prog = document.getElementById('prog');

function drawProg(at){
  prog.innerHTML = '';
  for(let i=0;i<Q.length+1;i++){
    const b = document.createElement('i');
    if(i <= at) b.className = 'on';
    prog.appendChild(b);
  }
}

function ready(q){
  if(q.type === 'multi') return (A[q.key]||[]).length > 0;
  return !!(A[q.key] && String(A[q.key]).trim());
}

function render(){
  if(result) return renderResult();
  const q = Q[step];
  drawProg(step);
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2>${q.title}</h2>` + (q.hint ? `<p class="hint">${q.hint}</p>` : '');

  if(q.type === 'text'){
    const i = document.createElement('input');
    i.type = 'text'; i.value = A[q.key] || ''; i.autocomplete = 'off';
    i.oninput = () => { A[q.key] = i.value; next.disabled = !ready(q); };
    i.onkeydown = e => { if(e.key === 'Enter' && ready(q)) next.click(); };
    card.appendChild(i);
  } else {
    const box = document.createElement('div');
    box.className = 'opts';
    q.opts.forEach(([val,lab])=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt' + (q.type === 'radio' ? ' radio' : '');
      b.innerHTML = `<span class="box"></span><span>${lab}</span>`;
      b.setAttribute('aria-pressed', (q.type==='radio' ? A[q.key]===val : (A[q.key]||[]).includes(val)) ? 'true':'false');
      b.onclick = () => {
        if(q.type === 'radio') A[q.key] = val;
        else {
          let cur = A[q.key] || [];
          if(val === 'none') cur = cur.includes('none') ? [] : ['none'];
          else cur = cur.includes(val) ? cur.filter(x=>x!==val) : cur.filter(x=>x!=='none').concat(val);
          A[q.key] = cur;
        }
        render();
      };
      box.appendChild(b);
    });
    card.appendChild(box);
  }

  const nav = document.createElement('div');
  nav.className = 'nav';
  const next = document.createElement('button');
  next.className = 'primary';
  next.textContent = step === Q.length - 1 ? 'Done' : 'Continue';
  next.disabled = !ready(q);
  next.onclick = () => { if(step === Q.length-1){ result = decide(A); } else step++; render(); };
  nav.appendChild(next);
  if(step > 0){
    const back = document.createElement('button');
    back.className = 'ghost'; back.textContent = 'Back';
    back.onclick = () => { step--; render(); };
    nav.appendChild(back);
  }
  card.appendChild(nav);
  app.innerHTML = '';
  app.appendChild(card);
  window.scrollTo(0,0);
}

function renderResult(){
  drawProg(Q.length);
  document.getElementById('title').textContent = 'Your machine';
  document.getElementById('sub').textContent = 'Pick a color, then send the configuration over.';
  app.innerHTML = '';
  const m = result.m;

  const v = document.createElement('div');
  v.className = 'card result';
  v.innerHTML = `<p class="machine">${m.name}</p>
    <p class="spec">${m.chip} \u00B7 ${result.ram} memory \u00B7 ${result.storage} storage</p>`;
  app.appendChild(v);

  const cc = document.createElement('div');
  cc.className = 'card';
  cc.innerHTML = '<h2>Pick a color</h2>';
  const sws = document.createElement('div');
  sws.className = 'swatches';
  m.colors.forEach(([nm,hex])=>{
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sw';
    b.setAttribute('aria-pressed', color === nm ? 'true' : 'false');
    b.innerHTML = `<span class="chip" style="background:${hex}"></span><span>${nm}</span>`;
    b.onclick = () => { color = nm; renderResult(); };
    sws.appendChild(b);
  });
  cc.appendChild(sws);
  app.appendChild(cc);

  if(color){
    const oc = document.createElement('div');
    oc.className = 'card';
    oc.innerHTML = '<h2>Send this over</h2><p class="hint">Copy and paste into Slack or email.</p>';
    const out = document.createElement('textarea');
    out.id = 'out'; out.readOnly = true; out.value = summary();
    oc.appendChild(out);
    const nav = document.createElement('div');
    nav.className = 'nav';
    const cp = document.createElement('button');
    cp.className = 'primary'; cp.textContent = 'Copy';
    cp.onclick = async () => {
      try { await navigator.clipboard.writeText(out.value); }
      catch(e){ out.select(); document.execCommand('copy'); }
      const done = document.createElement('span');
      done.className = 'copied'; done.textContent = 'Copied';
      cp.replaceWith(done);
      setTimeout(()=>done.replaceWith(cp), 2000);
    };
    nav.appendChild(cp);
    const again = document.createElement('button');
    again.className = 'ghost'; again.textContent = 'Start over';
    again.onclick = () => location.reload();
    nav.appendChild(again);
    oc.appendChild(nav);
    app.appendChild(oc);
  }
  window.scrollTo(0,0);
}

function summary(){
  const m = result.m, L = [];
  L.push(A.name);
  L.push('');
  L.push('Model:    ' + m.name);
  L.push('Chip:     ' + m.chip);
  L.push('Memory:   ' + result.ram);
  L.push('Storage:  ' + result.storage);
  L.push('Color:    ' + color);
  if(m.extras) L.push('SKU:      ' + m.extras);
  return L.join('\n');
}

render();
</script>
</body>
</html>
